<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مرجع تعاملی CITIBIG API</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png" />
  <style>
    html, body { margin: 0; padding: 0; }
    .citibig-header {
      background: #17335e; color: #fff; height: 52px;
      display: flex; align-items: center; gap: 14px; padding: 0 18px;
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    }
    .citibig-header img { height: 34px; background: #fff; border-radius: 6px; padding: 3px 6px; }
    .citibig-header .t { font-weight: 700; font-size: 15px; }
    .citibig-header a { color: #f5b301; text-decoration: none; font-size: 13px; margin-inline-start: auto; }
    .citibig-header a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="citibig-header">
    <img src="assets/img/logo.png" alt="CITIBIG" />
    <span class="t">CITIBIG API — مرجع تعاملی</span>
    <a href="index.html">← بازگشت به مستندات</a>
  </div>
  <!-- مرجع تعاملی CITIBIG API — رندرکنندهٔ Scalar، تغذیه‌شده از openapi-citibig.json -->

</html>
