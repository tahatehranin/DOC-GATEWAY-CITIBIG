# CITIBIG API Docs — MkDocs Material (RTL Persian, corporate theme)
# Build:  python -m mkdocs build --strict  (run from the MDDOCS directory)
# Preview:  python -m mkdocs serve

site_name: CITIBIG API
site_description: >-
  مستندات رسمی CITIBIG API — دسترسی یکپارچه به سرویس‌های استعلام،
  داده و ارتباطات با یک کلید API
site_author: CITIBIG
copyright: '© 2026 CITIBIG — تمام حقوق محفوظ است'

theme:
  name: material
  language: fa
  direction: rtl
  logo: assets/img/logo.png
  favicon: assets/img/logo.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: حالت شب
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: حالت روز
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

# فهرست ناوبری — برای افزودن مستند جدید، همین‌جا یک خط اضافه کنید
nav:
  - خانه: index.md
  - عمومی:
    - شروع سریع: getting-started.md
    - احراز هویت: authentication.md
    - کدهای پاسخ و خطا: errors.md
    - حق نشر و لایسنس: license.md
  - توسعه‌دهندگان:
    - سرویس‌های هویتی: services/identity.md
    - سرویس‌های بانکی: services/banking.md
    - قبوض آب، گاز و برق: services/bills.md
    - پیامک، تماس و صوت: services/telecom.md
    - خودرو و گواهینامه: services/vehicle.md
    - کسب‌وکار و اشخاص حقوقی: services/business.md
    - کدپستی و مکان: services/location.md
    - رسانه (فیلم و سریال): services/media.md
    - ابزارهای کمکی: services/tools.md

extra:
  generator: false
