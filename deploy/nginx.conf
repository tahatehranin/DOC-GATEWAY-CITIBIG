server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # فشرده‌سازی برای لود سریع مستندات
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/markdown;
  gzip_min_length 512;

  # health-check برای Dokploy / مانیتورینگ
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  # فایل‌های مارک‌داون مستندات (بدون کش تا ویرایش‌ها فوری دیده شود)
  location ~* \.md$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
