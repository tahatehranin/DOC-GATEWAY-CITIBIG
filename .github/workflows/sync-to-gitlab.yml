name: Mirror to GitLab (hamgit.ir)

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to hamgit.ir
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          set -e

          GITLAB_URL_HTTPS="https://oauth2:${GITLAB_TOKEN}@hamgit.ir/tahavey18/DOC-GATEWAY-CITIBIG.git"
          GITLAB_URL_SSH="git@hamgit.ir:tahavey18/DOC-GATEWAY-CITIBIG.git"

          if [ -n "$GITLAB_SSH_KEY" ]; then
            echo ">> Mirror over SSH (Deploy Key)"
            mkdir -p ~/.ssh
            printf '%s\n' "$GITLAB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_gitlab_mirror
            chmod 600 ~/.ssh/id_gitlab_mirror
            ssh-keyscan -t ed25519,rsa hamgit.ir >> ~/.ssh/known_hosts 2>/dev/null
            {
              echo "Host hamgit.ir"
              echo "  User git"
              echo "  IdentityFile ~/.ssh/id_gitlab_mirror"
              echo "  IdentitiesOnly yes"
            } > ~/.ssh/config
            chmod 600 ~/.ssh/config
            echo ">> SSH auth test:"
            ssh -o BatchMode=yes -o ConnectTimeout=15 -T git@hamgit.ir 2>&1 | head -2 || true
            git remote add gitlab "$GITLAB_URL_SSH"
          elif [ -n "$GITLAB_TOKEN" ]; then
            echo ">> Mirror over HTTPS (repository access token)"
            git remote add gitlab "$GITLAB_URL_HTTPS"
            git config http.version HTTP/1.1
          else
            echo "::error::Secret GITLAB_TOKEN (or GITLAB_SSH_KEY) is not set. Add it in: Repository Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

          if ! git push gitlab --all --force; then
            echo "::warning::Force push declined (possibly pre-receive hook blocking history rewrite). Trying delete + fresh push fallback..."
            for ref in $(git for-each-ref --format='%(refname:short)' refs/heads); do
              git push gitlab --delete "$ref" 2>/dev/null || true
            done
            if ! git push gitlab --all; then
              echo "::error::Mirror push failed even after delete+repush. Check: (1) Deploy Key has write access (Settings -> Repository -> Deploy keys), (2) GITLAB_SSH_KEY contains the full private key (BEGIN/END lines included), (3) GITLAB_TOKEN (if used instead) is valid with write_repository scope."
              exit 1
            fi
          fi
          git push gitlab --tags --force
