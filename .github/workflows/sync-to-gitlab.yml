
name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure destination authentication
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${GITLAB_SSH_KEY:-}" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$GITLAB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_gitlab_mirror
            chmod 600 ~/.ssh/id_gitlab_mirror

            ssh-keyscan -H -t ed25519,rsa hamgit.ir >> ~/.ssh/known_hosts 2>/dev/null
            test -s ~/.ssh/known_hosts

            cat > ~/.ssh/config <<'EOF'
          Host hamgit.ir
            HostName hamgit.ir
            User git
            IdentityFile ~/.ssh/id_gitlab_mirror
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
            chmod 600 ~/.ssh/config

            git remote add gitlab git@hamgit.ir:tahavey18/DOC-GATEWAY-CITIBIG.git
            ssh -o BatchMode=yes -o ConnectTimeout=20 -T git@hamgit.ir || true
          elif [ -n "${GITLAB_TOKEN:-}" ]; then
            git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@hamgit.ir/tahavey18/DOC-GATEWAY-CITIBIG.git"
            git config http.version HTTP/1.1
          else
            echo "::error::Set GITLAB_SSH_KEY or GITLAB_TOKEN in repository Actions secrets."
            exit 1
          fi

      - name: Sync branches without force-pushing
        run: |
          set -euo pipefail

          while IFS= read -r remote_ref; do
            [ -n "$remote_ref" ] || continue
            [ "$remote_ref" = "origin/HEAD" ] && continue

            branch="${remote_ref#origin/}"
            echo "Syncing branch: $branch"

            git checkout -B "$branch" "origin/$branch"

            if git ls-remote --exit-code --heads gitlab "$branch" >/dev/null 2>&1; then
              git fetch gitlab "refs/heads/$branch:refs/remotes/gitlab/$branch"

              git merge --no-edit --allow-unrelated-histories -s ours "refs/remotes/gitlab/$branch"
            fi

            git push gitlab "HEAD:refs/heads/$branch"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

      - name: Publish new tags
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            if git ls-remote --exit-code --tags gitlab "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag already exists on destination; leaving it unchanged: $tag"
            else
              git push gitlab "refs/tags/$tag:refs/tags/$tag"
            fi
          done < <(git tag --list)
          
